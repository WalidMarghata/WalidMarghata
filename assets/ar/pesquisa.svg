<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="196" viewBox="0 0 1000 196" role="img" aria-label="اكتشاف الشذوذ في الأنظمة الموزعة باستخدام تعلّم آلي قابل للتفسير">
  <title>محور البحث</title>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="brilho"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1000" height="196" rx="20"/></clipPath>
    <style>text{letter-spacing:0 !important}.k{font:700 12px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;letter-spacing:3px;fill:#22d3ee}.t{font:800 26px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#f8fafc;letter-spacing:-.3px}.d{font:500 14.5px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#b6c2da}.tg{font:700 12px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#ede9fe}</style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="196" fill="#0d1428"/>
    <circle cx="100" cy="30" r="170" fill="url(#brilho)"><animate attributeName="cx" values="100;160;100" dur="10s" repeatCount="indefinite"/></circle>
    <g opacity="0.55" stroke="#22d3ee" stroke-width="1.2" fill="none">
      <circle cx="130" cy="95" r="6" fill="#22d3ee" stroke="none"/><circle cx="70" cy="55" r="5" fill="#a78bfa" stroke="none"/><circle cx="60" cy="130" r="5" fill="#f472b6" stroke="none"/><circle cx="180" cy="140" r="4" fill="#a78bfa" stroke="none"/>
      <path d="M130 95L70 55M130 95L60 130M130 95L180 140M70 55L60 130"/>
      <circle cx="130" cy="95" r="12"><animate attributeName="r" values="8;18;8" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect width="1000" height="196" rx="20" fill="none" stroke="url(#p)" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="966" y="44" class="k" direction="rtl">محور البحث</text>
  <text x="966" y="82" class="t" direction="rtl">اكتشاف الشذوذ في الأنظمة الموزعة</text>
  <text x="966" y="110" class="t" direction="rtl" style="fill:url(#p)">باستخدام تعلّم آلي قابل للتفسير</text>
  <text x="966" y="134" class="d" direction="rtl">مشروع بحثي لدرجة الماجستير في علوم الحاسوب</text>
  <g transform="translate(830 148)"><rect width="136" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.65"/><text x="68" y="20" text-anchor="middle" class="tg">الأنظمة الموزعة</text></g><g transform="translate(699 148)"><rect width="121" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.65"/><text x="60.5" y="20" text-anchor="middle" class="tg">التعلّم الآلي</text></g><g transform="translate(441 148)"><rect width="248" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.65"/><text x="124" y="20" text-anchor="middle" class="tg">ذكاء اصطناعي قابل للتفسير (XAI)</text></g><g transform="translate(310 148)"><rect width="121" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.65"/><text x="60.5" y="20" text-anchor="middle" class="tg">اكتشاف الشذوذ</text></g>
</svg>
