<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Walid Marghata, مهندس برمجيات أول">
  <title>Walid Marghata — مهندس برمجيات أول</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="0.55" stop-color="#0d1630"/><stop offset="1" stop-color="#1a1244"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e0f2fe"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="grade" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <clipPath id="corte"><rect width="1000" height="330" rx="22"/></clipPath>
    <style>
      text{letter-spacing:0 !important}
      .tag{font:700 12px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;letter-spacing:3px;fill:#22d3ee}
      .nome{font:800 62px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:url(#nome);letter-spacing:-1.5px}
      .cargo{font:500 24px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#e6edf7}
      .frase{font:600 19px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#22d3ee}
      .code{font:13.5px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#cbd5e1}
      .chip{font:600 11.5px 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Noto Naskh Arabic', Arial, sans-serif;fill:#cbd5e1}
    </style>
  </defs>
  <g clip-path="url(#corte)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <circle cx="830" cy="70" r="260" fill="url(#g1)"><animate attributeName="cx" values="830;740;830" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="70;120;70" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="260" r="300" fill="url(#g2)"><animate attributeName="cx" values="180;270;180" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="260;200;260" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="-20" r="200" fill="url(#g3)"><animate attributeName="cx" values="440;360;440" dur="18s" repeatCount="indefinite"/></circle>
    <rect width="1000" height="330" fill="url(#grade)"/>
    <g opacity="0.9">
      <circle cx="580" cy="60" r="2" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="290" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="48" r="2.2" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="120" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.7s" repeatCount="indefinite"/></circle>
    </g>

    <text x="936" y="84" class="tag" direction="rtl">المحفظة · هندسة البرمجيات</text>
    <text x="936" y="156" class="nome" direction="rtl">Walid Marghata</text>
    <text x="934" y="192" class="cargo" direction="rtl">مهندس برمجيات أول</text>
    <text x="936" y="228" class="frase" opacity="0" direction="rtl">C# · .NET · Angular<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.027;0.307;0.333;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="936" y="228" class="frase" opacity="0" direction="rtl">أنظمة مؤسسية عالية الأداء<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.360;0.640;0.667;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="936" y="228" class="frase" opacity="0" direction="rtl">الحوسبة السحابية · DevOps · العمارة البرمجية<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.693;0.973;1.000;1" dur="12s" repeatCount="indefinite"/></text>

    <g transform="translate(541 256)">
      <rect x="0" width="99" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="49.5" y="20" text-anchor="middle" class="chip">.NET · C#</text>
      <rect x="111" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="153" y="20" text-anchor="middle" class="chip">Angular</text>
      <rect x="207" width="106" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="260" y="20" text-anchor="middle" class="chip">SQL Server</text>
      <rect x="325" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="360" y="20" text-anchor="middle" class="chip">Azure</text>
    </g>

    <g transform="translate(64 84)">
      <rect width="326" height="188" rx="14" fill="#0a1022" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="38" cy="18" r="5" fill="#fbbf24"/><circle cx="56" cy="18" r="5" fill="#34d399"/>
      <text x="270" y="22" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#64748b">profile.ts</text>
      <line x1="0" y1="36" x2="326" y2="36" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
    <text x="80" y="142" class="code" opacity="0" xml:space="preserve"><tspan fill="#c084fc">const</tspan> <tspan fill="#7dd3fc">walid</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#94a3b8">{</tspan><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.35s" fill="freeze"/></text>
    <text x="80" y="166" class="code" opacity="0" xml:space="preserve">  <tspan fill="#7dd3fc">role</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#86efac">"Senior Software Engineer"</tspan><tspan fill="#94a3b8">,</tspan><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.35s" fill="freeze"/></text>
    <text x="80" y="190" class="code" opacity="0" xml:space="preserve">  <tspan fill="#7dd3fc">stack</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#86efac">".NET"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#86efac">"Angular"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#86efac">"SQL"</tspan><tspan fill="#94a3b8">],</tspan><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.35s" fill="freeze"/></text>
    <text x="80" y="214" class="code" opacity="0" xml:space="preserve">  <tspan fill="#7dd3fc">focus</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#86efac">"performance &amp; reliability"</tspan><tspan fill="#94a3b8">,</tspan><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/></text>
    <text x="80" y="238" class="code" opacity="0" xml:space="preserve">  <tspan fill="#7dd3fc">learning</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#fcd34d">true</tspan><tspan fill="#94a3b8">,</tspan><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.35s" fill="freeze"/></text>
    <text x="80" y="262" class="code" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">};</tspan><animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.35s" fill="freeze"/></text>

    <rect x="0" y="326" width="1000" height="4" fill="url(#linha)"><animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="329" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
