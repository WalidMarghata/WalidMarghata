<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="GitHub statistics">
  <title>GitHub statistics</title>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <style>.t{font:700 22px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc;letter-spacing:.2px}</style>
  </defs>
  <rect x="2" y="12" width="277" height="40" rx="20" fill="#0b1220"/>
  <rect x="2" y="12" width="277" height="40" rx="20" fill="none" stroke="url(#a)" stroke-width="1.6"/>
  <circle cx="26" cy="32" r="15" fill="url(#a)"/>
  <g transform="translate(14.5 20.5) scale(.96)"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
  <text x="52" y="39.5" class="t">GitHub statistics</text>
  <rect x="293" y="31" width="703" height="2.4" rx="1.2" fill="url(#l)"><animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/></rect>
