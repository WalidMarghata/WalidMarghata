<svg xmlns="http://www.w3.org/2000/svg" width="488" height="168" viewBox="0 0 488 168" role="img" aria-label="Plataforma de Gestão Corporativa">
  <title>Plataforma de Gestão Corporativa</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <style>.n{font:700 19px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}.d{font:500 13.5px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#aebbd3}.tag{font:700 11px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#e2e8f0}.k{font:700 11px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#f472b6;letter-spacing:2px}</style></defs>
  <rect width="488" height="168" rx="18" fill="#0d1428"/>
  <rect width="488" height="168" rx="18" fill="none" stroke="url(#g)" stroke-opacity="0.7" stroke-width="1.3"/>
  <rect x="0" y="22" width="5" height="34" rx="2.5" fill="url(#g)"/>
  <text x="20" y="34" class="k">ARQUITETURA</text>
  <text x="20" y="56" class="n">Plataforma de Gestão Corporativa</text>
  <text x="20" y="78" class="d">Arquitetura distribuída em .NET e Angular,</text><text x="20" y="98" class="d">focada em desempenho e escalabilidade.</text>
  <g transform="translate(20 128)"><rect width="50" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.6"/><text x="25" y="16" text-anchor="middle" class="tag">.NET</text></g><g transform="translate(78 128)"><rect width="71" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.6"/><text x="35.5" y="16" text-anchor="middle" class="tag">Angular</text></g><g transform="translate(157 128)"><rect width="92" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.6"/><text x="46" y="16" text-anchor="middle" class="tag">SQL Server</text></g>
</svg>
