  <style>.a{font:800 34px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:-1px}.k{font:700 10.5px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:2px;fill:#94a3b8}.n{font:700 15.5px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}.e{font:500 12.5px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#9fb0cc}</style></defs>
