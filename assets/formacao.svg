<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Formação acadêmica">
  <title>Formação acadêmica</title>
  <defs><linearGradient id="trilho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <style>.ano{font:700 13px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.5px}.tit{font:700 18px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}.inst{font:500 13px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#94a3b8}.m{font:800 10.5px 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.5px;fill:#e9d5ff}</style></defs>
  <rect x="32.5" y="48" width="3" height="234" rx="1.5" fill="url(#trilho)" opacity="0.7"/>
  <g>
    <defs><linearGradient id="f0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
    <circle cx="34" cy="48" r="9" fill="#0b1220" stroke="url(#f0)" stroke-width="3"/>
    <rect x="70" y="14" width="930" height="68" rx="16" fill="#0d1428"/>
    <rect x="70" y="14" width="930" height="68" rx="16" fill="none" stroke="url(#f0)" stroke-opacity="0.65" stroke-width="1.2"/>
    <rect x="70" y="28" width="4" height="40" rx="2" fill="url(#f0)"/>
    <text x="92" y="44" class="ano" fill="#a78bfa">2026</text>
    <text x="92" y="66" class="tit">Mestrado em Ciência da Computação</text>
    <text x="960" y="66" text-anchor="end" class="inst">Universidade Federal de Minas Gerais (UFMG) · PPGCC</text>
    <g transform="translate(830 24)"><rect width="130" height="26" rx="13" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.7"/><text x="65" y="17.5" text-anchor="middle" class="m">EM ANDAMENTO</text></g>
    <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <defs><linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
    <circle cx="34" cy="126" r="9" fill="#0b1220" stroke="url(#f1)" stroke-width="3"/>
    <rect x="70" y="92" width="930" height="68" rx="16" fill="#0d1428"/>
    <rect x="70" y="92" width="930" height="68" rx="16" fill="none" stroke="url(#f1)" stroke-opacity="0.65" stroke-width="1.2"/>
    <rect x="70" y="106" width="4" height="40" rx="2" fill="url(#f1)"/>
    <text x="92" y="122" class="ano" fill="#22d3ee">2023 – 2024</text>
    <text x="92" y="144" class="tit">Especialização em Engenharia de Software</text>
    <text x="960" y="144" text-anchor="end" class="inst">Estácio · carga horária de 360 h</text>
    
    <animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <defs><linearGradient id="f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
    <circle cx="34" cy="204" r="9" fill="#0b1220" stroke="url(#f2)" stroke-width="3"/>
    <rect x="70" y="170" width="930" height="68" rx="16" fill="#0d1428"/>
    <rect x="70" y="170" width="930" height="68" rx="16" fill="none" stroke="url(#f2)" stroke-opacity="0.65" stroke-width="1.2"/>
    <rect x="70" y="184" width="4" height="40" rx="2" fill="url(#f2)"/>
    <text x="92" y="200" class="ano" fill="#f472b6">2020 – 2023</text>
    <text x="92" y="222" class="tit">Graduação em Ciência da Computação</text>
    <text x="960" y="222" text-anchor="end" class="inst">Estácio</text>
    
    <animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <defs><linearGradient id="f3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
    <circle cx="34" cy="282" r="9" fill="#0b1220" stroke="url(#f3)" stroke-width="3"/>
    <rect x="70" y="248" width="930" height="68" rx="16" fill="#0d1428"/>
    <rect x="70" y="248" width="930" height="68" rx="16" fill="none" stroke="url(#f3)" stroke-opacity="0.65" stroke-width="1.2"/>
    <rect x="70" y="262" width="4" height="40" rx="2" fill="url(#f3)"/>
    <text x="92" y="278" class="ano" fill="#fb923c">2018 – 2020</text>
    <text x="92" y="300" class="tit">Graduação em Análise e Desenvolvimento de Sistemas</text>
    <text x="960" y="300" text-anchor="end" class="inst">Estácio</text>
    
    <animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.6s" fill="freeze"/>
  </g>
</svg>
